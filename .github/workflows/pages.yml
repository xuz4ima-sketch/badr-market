# Публикует папку site на GitHub Pages (ветка gh-pages).
# Запускается после каждого пуша в main, где изменился сайт, PDF-прайс или скрипт:
# из свежего файла «Прайс на ДД.ММ.ГГ.pdf» пересобирает прайс сайта и файл Excel.
name: Публикация сайта

on:
  push:
    branches: [main]
    paths: ["site/**", "Прайс*.pdf", "обновить-прайс.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить пакеты для прайса
        run: pip install --quiet openpyxl==3.1.5 pymupdf

      - name: Собрать прайс из PDF
        id: prices
        run: |
          python "обновить-прайс.py"
          # Excel каждый раз получается чуть другим (время создания внутри файла), поэтому смотрим только на таблицу.
          if git diff --quiet -- site/data/prices.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Сохранить прайс в репозитории
        if: steps.prices.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git commit -m "Прайс пересобран из PDF"
          git pull --rebase
          git push

      # Браузер держит CSS и JS в кэше до 10 минут. Без новой версии в адресе после
      # обновления сайта он мог взять новую страницу со старым скриптом, и страница ломалась.
      - name: Привязать версии CSS и JS к коммиту
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::8}/g" site/index.html

      - name: Опубликовать сайт
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
